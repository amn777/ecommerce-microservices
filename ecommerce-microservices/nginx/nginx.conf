worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ─────────────────────────────────────────────
    # LOGGING FORMAT
    # ─────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ─────────────────────────────────────────────
    # PERFORMANCE SETTINGS
    # ─────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/rss+xml
               application/atom+xml image/svg+xml;

    # ─────────────────────────────────────────────
    # RATE LIMITING ZONES
    # ─────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/m;

    # ─────────────────────────────────────────────
    # UPSTREAM - API GATEWAY
    # ─────────────────────────────────────────────
    upstream api_gateway {
        server api-gateway:3000;
        keepalive 32;
    }

    # ─────────────────────────────────────────────
    # SERVER BLOCK
    # ─────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header Content-Security-Policy "default-src 'self' http: https:;" always;
        add_header X-Gateway "nginx-ecommerce" always;

        # Hide server version
        server_tokens off;

        # ─── Health Check (no rate limit) ───────
        location /health {
            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            access_log off;
        }

        location = / {
            try_files /index.html =404;
        }

        location ~* \.(?:css|js)$ {
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public";
        }

        # ─── Auth endpoints (strict rate limit) ─
        location /api/v1/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            limit_req_status 429;

            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # ─── API endpoints (standard rate limit) ─
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
        }

        # ─── Custom error pages ──────────────────
        error_page 404 /404.json;
        error_page 429 /429.json;
        error_page 500 502 503 504 /50x.json;

        location = /404.json {
            return 404 '{"status":"error","message":"Route not found"}';
            add_header Content-Type application/json;
        }
        location = /429.json {
            return 429 '{"status":"error","message":"Too many requests. Please slow down."}';
            add_header Content-Type application/json;
        }
        location = /50x.json {
            return 503 '{"status":"error","message":"Service temporarily unavailable"}';
            add_header Content-Type application/json;
        }
    }
}
